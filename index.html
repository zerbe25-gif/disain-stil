<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Психологические услуги — Элегантный минимализм</title>
  <style>
    :root {
      --butter-cream: #F7F4EE;
      --denim: #2B4C6F;
      --powder-blue: #8E9CA3;
      --section-bg: #d8e3e9;
      --text-dark: #2C2C2C;
      --terracotta: #B87D64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--butter-cream);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Технический скрытый контейнер для SVG-фильтра */
    .svg-filter-hidden {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* Шапка сайта */
    header {
      background-color: #FAF8F3;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(43, 76, 111, 0.1);
    }

    .logo {
      font-family: serif;
      font-size: 1.2rem;
      color: var(--denim);
    }

    .header-btn {
      background-color: var(--butter-cream);
      border: 1px solid rgba(43, 76, 111, 0.2);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-dark);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .header-btn:hover {
      transform: scale(0.96);
    }

    /* Главный блок / Слайдер */
    .hero-section {
      padding: 40px 20px 60px 20px;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-family: serif;
      font-size: 2.2rem;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 24px;
      font-weight: 400;
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(43, 76, 111, 0.1);
      border: 6px solid #FAF8F3;
      background: #000;
    }

    .slide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      transform: translateX(100%);
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .slide.active {
      transform: translateX(0);
      z-index: 2;
    }

    .slide.incoming {
      z-index: 3;
      transform: translateX(0);
    }

    .timer-pagination {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: rgba(247, 244, 238, 0.35);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dot-indicator {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(44, 44, 44, 0.3);
      overflow: hidden;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.5s;
      cursor: pointer;
    }

    .dot-indicator.active {
      width: 60px;
      border-radius: 10px;
    }

    .dot-indicator .fill {
      position: absolute;
      top: 0; left: 0; height: 100%; width: 0%;
      background: var(--denim);
      border-radius: 10px;
    }

    .dot-indicator.active .fill {
      animation: fillProgress 10s linear forwards;
    }

    @keyframes fillProgress {
      from { width: 0%; }
      to { width: 100%; }
    }

    /* ==========================================================
       СЕКЦИЯ «МОЙ ПОДХОД» С ПЛАВНЫМ РАЗМЫТЫМ ПЕРЕХОДОМ
       ========================================================== */
    .approach-section {
      position: relative;
      z-index: 5;
      padding: 90px 20px 60px 20px; /* Верхний отступ увеличен для градиентной дымки */
      margin-top: -40px; /* Мягкое перекрытие предыдущего блока */
      background-color: var(--section-bg);
      
      /* Маска градиентной прозрачности для размытия верхней границы */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 70px, black 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 70px, black 100%);
    }

    /* Текстурный слой с фильтром кисти */
    .approach-section::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      background-color: var(--section-bg);
      filter: url(#microBrush);
      opacity: 0.65;
    }

    /* Тонкие штрихи */
    .approach-section::after {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 6px 100%;
      background-repeat: repeat;
      pointer-events: none;
      z-index: 2;
    }

    .approach-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
      gap: 20px;
      position: relative;
      z-index: 3;
    }

    .ink-tree {
      width: 140px;
      height: 200px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- SVG-фильтр -->
  <svg class="svg-filter-hidden">
    <filter id="microBrush">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.12" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.25  0 0 0 0 0.35  0 0 0 0.18 0" />
    </filter>
  </svg>

  <header>
    <div class="logo">Психолог</div>
    <button class="header-btn">Записаться</button>
  </header>

  <section class="hero-section">
    <h1>Смотреть на человека целостно</h1>
    
    <div class="slider-container">
      <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=800&q=80');"></div>
      <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80');"></div>
      <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80');"></div>

      <div class="timer-pagination">
        <div class="dot-indicator active"><div class="fill"></div></div>
        <div class="dot-indicator"><div class="fill"></div></div>
        <div class="dot-indicator"><div class="fill"></div></div>
      </div>
    </div>
  </section>

  <!-- Секция с градиентным размытым верхним краем -->
  <section class="approach-section">
    <div class="approach-content">
      <div>
        <h3 style="font-family: serif; font-size: 1.4rem; margin-bottom: 10px; color: var(--denim);">Мой подход</h3>
        <p style="font-size: 0.95rem; line-height: 1.5; color: #4A5568;">Психодинамический подход в сочетании с биопсихосоциальной моделью...</p>
      </div>
      <svg class="ink-tree" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 260 Q60 180 80 120 T110 40" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M75 140 Q110 110 140 90" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M65 170 Q30 140 20 110" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="145" cy="85" rx="10" ry="5" fill="#2B4C6F" transform="rotate(-25 145 85)" opacity="0.9" filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.3))"/>
        <ellipse cx="15" cy="105" rx="9" ry="4" fill="#2B4C6F" transform="rotate(35 15 105)" opacity="0.85" filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.3))"/>
        <ellipse cx="115" cy="35" rx="8" ry="4" fill="#2B4C6F" transform="rotate(-10 115 35)" opacity="0.9" filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.3))"/>
      </svg>
    </div>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const slides = document.querySelectorAll(".slide");
      const dots = document.querySelectorAll(".dot-indicator");
      let currentIndex = 0;

      function goToSlide(nextIndex) {
        if (nextIndex === currentIndex) return;
        const currentSlide = slides[currentIndex];
        const nextSlide = slides[nextIndex];

        nextSlide.style.transition = "none";
        nextSlide.style.transform = "translateX(100%)";
        nextSlide.classList.remove("active");
        void nextSlide.offsetWidth;

        nextSlide.style.transition = "transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)";
        nextSlide.classList.add("incoming");

        dots[currentIndex].classList.remove("active");
        dots[nextIndex].classList.add("active");

        setTimeout(() => {
          currentSlide.classList.remove("active");
          nextSlide.classList.remove("incoming");
          nextSlide.classList.add("active");
          currentIndex = nextIndex;
        }, 1200);
      }

      setInterval(() => {
        const nextIndex = (currentIndex + 1) % slides.length;
        goToSlide(nextIndex);
      }, 10000);

      dots.forEach((dot, index) => {
        dot.addEventListener("click", () => goToSlide(index));
      });
    });
  </script>
</body>
</html>
