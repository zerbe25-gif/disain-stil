<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Психологические услуги — Элегантный минимализм</title>
  <style>
    :root {
      --butter-cream: #F7F4EE;
      --section-bg: #5C8C8D; /* Заменен синий на #5C8C8D */
      --text-dark: #2C2C2C;
      --text-light: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--butter-cream);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Шапка сайта */
    header {
      background-color: #FAF8F3;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(43, 76, 111, 0.1);
      position: relative;
      z-index: 10;
    }

    .logo {
      font-family: serif;
      font-size: 1.2rem;
      color: var(--section-bg);
    }

    .header-btn {
      background-color: var(--butter-cream);
      border: 1px solid rgba(92, 140, 141, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-dark);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .header-btn:hover {
      transform: scale(0.96);
    }

    /* 1. ВЕРХНЯЯ ЧАСТЬ С ФОТО */
    .hero-section {
      padding: 40px 20px 60px 20px;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .slider-container {
      position: relative;
      width: 100%;
      height: 480px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border: 6px solid #FAF8F3;
      background: #000;
    }

    .slide {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      transform: translateX(100%);
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .slide.active {
      transform: translateX(0);
      z-index: 2;
    }

    .slide.incoming {
      z-index: 3;
      transform: translateX(0);
    }

    .timer-pagination {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: rgba(247, 244, 238, 0.35);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dot-indicator {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(44, 44, 44, 0.3);
      overflow: hidden;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.5s;
      cursor: pointer;
    }

    .dot-indicator.active {
      width: 60px;
      border-radius: 10px;
    }

    .dot-indicator .fill {
      position: absolute;
      top: 0; left: 0; height: 100%; width: 0%;
      background: var(--section-bg);
      border-radius: 10px;
    }

    .dot-indicator.active .fill {
      animation: fillProgress 10s linear forwards;
    }

    @keyframes fillProgress {
      from { width: 0%; }
      to { width: 100%; }
    }
